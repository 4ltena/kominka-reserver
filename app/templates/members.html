{% extends "base.html" %}
{% block main %}
<h2 class="section">名簿</h2>
<form method="post" action="{{ url_for('members_add') }}" class="add">
  <input type="text" name="name" placeholder="名前" required>
  <button type="submit" class="btn small">追加</button>
</form>
<ul class="members">
  {% for m in members %}
  <li class="{{ 'hidden' if not m['active'] }}">
    <span>{{ m['name'] }}</span>
    <form method="post" action="{{ url_for('members_hide') }}">
      <input type="hidden" name="member_id" value="{{ m['id'] }}">
      <input type="hidden" name="active" value="{{ 0 if m['active'] else 1 }}">
      <button type="submit" class="link">{{ '非表示にする' if m['active'] else '戻す' }}</button>
    </form>
  </li>
  {% else %}
  <li class="empty">名簿が空です。</li>
  {% endfor %}
</ul>

{% endblock %}
