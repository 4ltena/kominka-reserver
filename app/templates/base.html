<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}風呂・ごはん{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body data-fragment="{% if request.endpoint == 'bath' %}{{ url_for('bath_fragment', date=day_value) }}{% elif request.endpoint == 'meals_page' %}{{ url_for('meals_fragment') }}{% endif %}">

<header>
  <nav class="tabs">
    <a href="{{ url_for('bath') }}" class="{{ 'on' if request.endpoint in ('bath', 'index') }}">風呂</a>
    <a href="{{ url_for('meals_page') }}" class="{{ 'on' if request.endpoint == 'meals_page' }}">ごはん</a>
  </nav>
  <p class="who">
    {% if member %}{{ member['name'] }}{% else %}名前未選択{% endif %}
    <a href="{{ url_for('select') }}">変更</a>
  </p>
</header>

{% with messages = get_flashed_messages() %}
{% if messages %}
<ul class="flash">{% for message in messages %}<li>{{ message }}</li>{% endfor %}</ul>
{% endif %}
{% endwith %}

<main>{% block main %}{% endblock %}</main>

<footer><a href="{{ url_for('members') }}">名簿</a></footer>

<script>
(function () {
  var url = document.body.dataset.fragment;
  var live = document.getElementById('live');
  if (!url || !live) { return; }
  setInterval(function () {
    fetch(url, { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.text() : null; })
      .then(function (html) { if (html !== null) { live.innerHTML = html; } })
      .catch(function () {});
  }, 10000);
})();
</script>
</body>
</html>
