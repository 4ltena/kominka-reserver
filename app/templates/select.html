{% extends "base.html" %}
{% block main %}
<h2 class="section">名前を選ぶ</h2>
{% if members %}
<form method="post" action="{{ url_for('select_post') }}" class="pick">
  {% for m in members %}
  <button type="submit" name="member_id" value="{{ m['id'] }}" class="free">{{ m['name'] }}</button>
  {% endfor %}
</form>
<p class="note">選んだ名前はこの端末が覚える。</p>
{% else %}
<p class="empty">名簿がまだ空。<a href="{{ url_for('members') }}">名簿</a>で参加者を登録する。</p>
{% endif %}
{% endblock %}
